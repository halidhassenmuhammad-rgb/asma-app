<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አስማ بنت بابا - የኢባዳ ማስታወሻ</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="niqab-avatar">
                <!-- ኒቃብ ያደረገች ሴት ምልክት/ኢኮን -->
                <i class="fa-solid fa-user-ninja"></i>
            </div>
            <h1>አስማ بنت بابا</h1>
            <p class="subtitle">"እነሆ በእስልምና ውበት እና በኢባዳ ላይ የጸናች..."</p>
        </header>

        <!-- Daily Hadith Banner -->
        <div class="hadith-card">
            <h3><i class="fa-solid fa-quote-left"></i> ዕለታዊ ማስታወሻ / ሀዲስ</h3>
            <p id="daily-hadith">"እውነተኛው ሙስሊም አንደበቱንና እጁን ከሌሎች ሙስሊሞች የጠበቀ ነው።"</p>
        </div>

        <!-- Worship Tracker Section -->
        <section class="tracker-section">
            <h2><i class="fa-solid fa-clipboard-check"></i> የዕለት ኢባዳ ክትትል</h2>
            
            <div class="tracker-group">
                <h3>🕌 5ቱ የሰላት ሰዓቶች</h3>
                <label><input type="checkbox" class="task"> ሱብሂ (Fajr)</label>
                <label><input type="checkbox" class="task"> ዙሁር (Dhuhr)</label>
                <label><input type="checkbox" class="task"> አስር (Asr)</label>
                <label><input type="checkbox" class="task"> መግሪብ (Maghrib)</label>
                <label><input type="checkbox" class="task"> ኢሻ (Isha)</label>
            </div>

            <div class="tracker-group">
                <h3>📖 ቁርአን እና ዚክር</h3>
                <label><input type="checkbox" class="task"> ቁርአን መቅራት (ቢያንስ 1 ገጽ)</label>
                <label><input type="checkbox" class="task"> ዚክር ማድረግ (አልሃምዱሊላህ፣ሱብሃንአላህ...)</label>
                <label><input type="checkbox" class="task"> ሌሎች መልካም ስራዎች (ሶደቃ/መልካም ንግግር)</label>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <p>የተዘጋጀው በልዩ ፍቅር ለኢስላማዊ እውቀት | 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
